      <style>
        
        .alia-loader {
          position: fixed;
          inset: 0;
          z-index: 9999;
          background: #ffffff;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .alia-loader__content {
          text-align: center;
        }

        .alia-loader__spinner {
          width: 130px;
          height: 130px;
          margin: 0 auto 48px;
          border-radius: 50%;
          border: 3px solid rgba(27, 42, 74, 0.18);
          border-top-color: #f26522;
          animation: aliaSpin 1s linear infinite;
        }

        .alia-loader__text {
          font-family: var(--font-h), "Gotham-Light", sans-serif;
          font-size: 88px;
          font-weight: 800;
          letter-spacing: 0.12em;
          line-height: 1;
        }

        .alia-loader__letter {
          position: relative;
          display: inline-block;
          color: rgba(27, 42, 74, 0.18);
        }

        .alia-loader__letter::before {
          content: attr(data-text);
          position: absolute;
          inset: 0;
          color: #1b2a4a;
          opacity: 0;
          transform: rotateY(-90deg);
          animation: aliaLetters 2.4s infinite;
          animation-delay: inherit;
        }

        .alia-loader__letter:nth-child(1)::before,
        .alia-loader__letter:nth-child(4)::before {
          color: #1C3664;
        }

        @keyframes aliaSpin {
          to {
            transform: rotate(360deg);
          }
        }

        @keyframes aliaLetters {
          0%,
          75%,
          100% {
            opacity: 0;
            transform: rotateY(-90deg);
          }

          25%,
          50% {
            opacity: 1;
            transform: rotateY(0deg);
          }
        }

        @media (max-width: 768px) {
          .alia-loader__spinner {
            width: 105px;
            height: 105px;
          }

          .alia-loader__text {
            font-size: 58px;
          }
        }
      </style>
